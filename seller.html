<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hammerindex — seller dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,200..700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B0E14;--bezel:#151A24;--bezel2:#1B2230;--hair:#242D3C;
--parch:#E8E2D4;--parch2:#A8A296;--steel:#6B7A8F;--steel2:#3E4A5C;
--amber:#E8A33D;--oxide:#C4442E;--verd:#4A8C7B;--pad:clamp(14px,2.6vw,36px)}
*{box-sizing:border-box;margin:0}
body{background:var(--ink);color:var(--parch);font-family:Newsreader,serif;padding:var(--pad)}
nav{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
nav a{color:var(--amber);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:12px;border-bottom:1px dotted var(--amber)}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:99px;overflow:hidden;margin-left:auto}
.seg button{background:var(--bezel);border:0;color:var(--parch2);font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:8px 16px;cursor:pointer}
.seg button.on{background:var(--amber);color:var(--ink);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--amber);letter-spacing:.14em;text-transform:uppercase;margin:14px 0 8px}
h1{font-family:Archivo,sans-serif;font-stretch:72%;font-weight:800;font-size:clamp(30px,5vw,54px);letter-spacing:-.01em}
.window{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--steel);margin-top:6px}
/* header stats */
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0}
.stat{background:var(--bezel);border:1px solid var(--hair);border-radius:10px;padding:12px 18px;min-width:118px}
.stat b{font-family:Archivo,sans-serif;font-weight:700;font-size:22px;display:block}
.stat span{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--steel);letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chips i{font-style:normal;background:var(--bezel2);border-radius:99px;padding:5px 12px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--parch2)}
.pips{margin:8px 0 2px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--parch2)}
.pips span{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--bezel2);margin-right:4px;vertical-align:-1px}
.pips span.on{background:var(--amber)}
/* panels */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-top:18px}
.panel{background:var(--bezel);border:1px solid var(--hair);border-radius:10px;padding:18px;display:flex;flex-direction:column}
.panel h2{font-family:Archivo,sans-serif;font-stretch:80%;font-weight:700;font-size:16px;margin-bottom:4px}
.panel .k{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--amber);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.big{font-family:Archivo,sans-serif;font-weight:800;font-size:30px;margin:2px 0}
.pctbar{height:8px;background:var(--bezel2);border-radius:4px;margin:8px 0 4px;position:relative;overflow:hidden}
.pctbar i{position:absolute;top:0;bottom:0;left:0;background:var(--amber);border-radius:4px}
.pctlab{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--steel)}
.confound{border-top:1px solid var(--hair);margin-top:auto;padding-top:10px;color:var(--parch2);font-size:13.5px;line-height:1.45}
.confound b{color:var(--verd);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:3px}
table{border-collapse:collapse;width:100%;font-family:'IBM Plex Mono',monospace;font-size:12px;margin:6px 0;display:block;overflow-x:auto}
th{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--steel);text-align:right;padding:5px 8px;border-bottom:1px solid var(--hair)}
th.l,td.l{text-align:left}
td{padding:6px 8px;border-bottom:1px solid var(--bezel2);text-align:right;white-space:nowrap}
.zp{color:var(--amber);font-size:10px}
.crit{color:var(--oxide);font-weight:600}
.dim{color:var(--steel)}
.empty{color:var(--steel);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 0}
/* timeline */
.tl{display:flex;align-items:flex-end;gap:4px;height:74px;margin:8px 0}
.tl .m{flex:1;display:flex;flex-direction:column-reverse;gap:2px}
.tl .sold{background:var(--verd);border-radius:2px 2px 0 0;opacity:.85}
.tl .rnm{background:var(--steel2);border-radius:2px}
.tl-lab{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--steel)}
.legend{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--parch2);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 5px 0 12px;vertical-align:-1px}
.counter{border-left:3px solid var(--verd);background:var(--bezel);border-radius:0 10px 10px 0;padding:16px 18px;margin-top:18px;color:var(--parch2);font-size:14.5px;line-height:1.5;max-width:100%}
.counter b{color:var(--parch)}
footer{margin-top:24px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel)}
</style></head><body>
<nav><a href="explorer.html">← seller ledger</a>
  <div class="seg" role="group" aria-label="view mode"><button id="mSimple">simple</button><button id="mAdv">advanced</button></div>
</nav>
<div id="root"><div class="empty">loading dossier…</div></div>
<footer>generated by engine/build_dossier_data.py · every figure computed from the warehouse at build time · descriptive signals only; nothing on this page asserts intent</footer>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt$=v=>v>=1e6?'$'+(v/1e6).toFixed(2)+'M':v>=1e3?'$'+Math.round(v/1e3).toLocaleString()+'k':'$'+Math.round(v);
const slug=new URLSearchParams(location.search).get('s');
let MODE=localStorage.getItem('hxmode')||'simple',DOSSIER=null;
function setMode(m){MODE=m;localStorage.setItem('hxmode',m);
  document.getElementById('mSimple').classList.toggle('on',m==='simple');
  document.getElementById('mAdv').classList.toggle('on',m==='adv');
  if(DOSSIER)render(DOSSIER);}
document.getElementById('mSimple').onclick=()=>setMode('simple');
document.getElementById('mAdv').onclick=()=>setMode('adv');
if(!slug){document.getElementById('root').innerHTML='<div class="empty">No seller selected — pick one from the <a href="explorer.html" style="color:var(--amber)">ledger</a>.</div>';}
else fetch(`data/sellers/shard-${slug[0]}.json`).then(r=>r.json()).then(sh=>{
  const d=sh[slug];
  if(!d){document.getElementById('root').innerHTML='<div class="empty">Seller not found. Return to the <a href="explorer.html" style="color:var(--amber)">ledger</a>.</div>';return;}
  document.title=`hammerindex — ${d.name}`;
  DOSSIER=d;setMode(MODE);
});
function pctbar(p,lab){return p==null?'':`<div class="pctbar"><i style="width:${p}%"></i></div><div class="pctlab">${lab}</div>`}
function render(d){
  const S=MODE==='simple';
  const sig=d.signals||{};
  const sigNames=S
   ?{alpha_hi:'prices unusually high vs similar cars',rnm_hi:'failed bids unusually high',conc:'devoted bidders who never buy',phantoms:'inflated failed bids',compwash:'failed price echoed in a later sale'}
   :{alpha_hi:'price premium ≥ P95',rnm_hi:'RNM elevation ≥ P95',conc:'≥2 concentrated zero-win repeat bidders',phantoms:'≥2 phantom prices',compwash:'comp-wash instance'};
  const active=Object.keys(sig).filter(k=>sig[k]).map(k=>sigNames[k]);
  const pips=[0,1,2,3,4].map(i=>`<span class="${i<d.priority?'on':''}"></span>`).join('');
  const zpTag=S?' <span class="zp">NEVER BOUGHT</span>':' <span class="zp">ZERO-PURCHASE</span>';
  const alpha=d.alpha?`<div class="big">${S?`${Math.abs(d.alpha.value)}% ${d.alpha.value>=0?'higher':'lower'}`:`${d.alpha.value>0?'+':''}${d.alpha.value}%`}</div>
      <div class="pctlab">${S?`than typical, across ${d.alpha.n} sales of comparable cars`:`median premium vs cohort benchmark · n=${d.alpha.n} scored lots · MAD-z ${d.alpha.z>0?'+':''}${d.alpha.z}`}</div>
      ${pctbar(d.alpha.pct,S?`higher than ${d.alpha.pct}% of comparable sellers`:`P${d.alpha.pct} among sellers with ≥4 scored lots`)}`
    :`<div class="empty">${S?'not enough sales to compare fairly':'fewer than 4 benchmarkable sold lots — premium not scoreable at this volume'}</div>`;
  const rnmEl=d.rnm_elevation?`<div class="big">${S?`${Math.abs(d.rnm_elevation.value)}% ${d.rnm_elevation.value>=0?'above':'below'}`:`${d.rnm_elevation.value>0?'+':''}${d.rnm_elevation.value}%`}</div>
      <div class="pctlab">${S?`typical prices, across ${d.rnm_elevation.n} auctions that ended without a sale`:`median failed-high-bid vs cohort · n=${d.rnm_elevation.n} RNM lots`}</div>
      ${pctbar(d.rnm_elevation.pct,S?`higher than ${d.rnm_elevation.pct}% of comparable sellers`:`P${d.rnm_elevation.pct} among sellers with ≥3 RNM lots`)}`
    :`<div class="empty">${S?'too few unsold auctions to measure':'fewer than 3 benchmarkable RNM lots'}</div>`;
  const phantoms=d.phantoms.length?`<table><thead><tr><th class="l">${S?'car':'lot'}</th><th>${S?'top bid':'high bid'}</th><th>${S?'vs typical':'above cohort'}</th><th>date</th></tr></thead><tbody>${
      d.phantoms.map(p=>`<tr><td class="l">${esc(p.title)}</td><td>${fmt$(p.high_bid)}</td><td class="crit">+${p.above_pct}%</td><td class="dim">${p.date}</td></tr>`).join('')}</tbody></table>`
    :`<div class="empty">${S?'none — no unsold auction had bidding far above typical':'no failed high bids ≥50% above cohort median'}</div>`;
  const cw=d.compwash.hits.length?`<table><thead><tr><th class="l">${S?'auction that didn’t sell':'failed lot'}</th><th>${S?'top bid':'rnm high'}</th><th class="l">later sale</th><th>price</th><th>${S?'difference':'gap'}</th><th>days</th></tr></thead><tbody>${
      d.compwash.hits.map(h=>`<tr><td class="l">${esc(h.rnm_title)}</td><td>${fmt$(h.rnm_high)}</td><td class="l">${esc(h.later_title)}</td><td>${fmt$(h.later_price)}</td><td class="crit">${h.gap_pct>0?'+':''}${h.gap_pct}%</td><td class="dim">${h.days}</td></tr>`).join('')}</tbody></table>
      <div class="pctlab">${S?`for scale: across the whole market this close a match happens in only ${d.compwash.base_rate_pct}% of chances`:`market base rate for a ±2% landing: ${d.compwash.base_rate_pct}% of candidate pairs`}</div>`
    :`<div class="empty">${S?'no — none of their later sales closely matched a price that had failed':'no same-seller sale landed within ±2% of a failed number ('+d.compwash.opportunities+' opportunit'+(d.compwash.opportunities===1?'y':'ies')+')'}</div>`;
  const repeat=d.repeat.length?`<table><thead><tr><th class="l">${S?'bidder':'account'}</th><th>${S?'their auctions here':'lots here'}</th><th>${S?'% of all their bidding':'share of their bidding'}</th><th>${S?'bought here':'wins here'}</th><th>${S?'bought anywhere':'wins anywhere'}</th>${S?'':'<th>p</th>'}</tr></thead><tbody>${
      d.repeat.map(r=>`<tr><td class="l">${esc(r.account)}${r.zero_purchase?zpTag:''}</td><td>${r.lots_here}/${r.total}</td><td>${r.share}%</td><td>${r.wins_here}</td><td>${r.wins_anywhere}</td>${S?'':`<td class="${r.p<0.01?'crit':'dim'}">${r.p}</td>`}</tr>`).join('')}</tbody></table>`
    :`<div class="empty">${S?'no bidder has come back to 3 or more of their auctions':'no account has bid on ≥3 of this seller’s lots'}</div>`;
  const actors=d.actors.length?`<table><thead><tr><th class="l">${S?'bidder':'account'}</th><th>${S?'price raises':'displacements'}</th><th>${S?'finished 2nd':'final underbidder'}</th><th>${S?'ever bought a car':'wins anywhere'}</th></tr></thead><tbody>${
      d.actors.map(a=>`<tr><td class="l">${esc(a.account)}${a.zero_purchase?zpTag:''}</td><td>${a.displacements}</td><td>${a.final_underbidder}</td><td>${a.wins_anywhere}</td></tr>`).join('')}</tbody></table>`
    :`<div class="empty">${S?'no bidding detail captured for these auctions':'no ladder activity captured'}</div>`;
  const maxM=Math.max(1,...d.timeline.map(t=>t.sold+t.rnm));
  const tl=d.timeline.length?`<div class="tl">${d.timeline.map(t=>`<div class="m" title="${t.m}: ${t.sold} sold, ${t.rnm} rnm">
      <div class="sold" style="height:${t.sold/maxM*66}px"></div><div class="rnm" style="height:${t.rnm/maxM*66}px"></div></div>`).join('')}</div>
      <div class="tl-lab"><span>${d.timeline[0].m}</span><span>${d.timeline[d.timeline.length-1].m}</span></div>
      <div class="legend">monthly lots<i style="background:var(--verd)"></i>sold<i style="background:var(--steel2)"></i>reserve not met</div>`:'';
  const T=S?{
    eyebrow:`seller report · activity ${d.first??'—'} to ${d.last??'—'}`,
    pipsLabel:`worth a look: ${d.priority} of 5 — ${active.length?esc(active.join(' · ')):'nothing unusual stands out'}`,
    p1t:'Do their cars sell for more than similar cars?',
    p2t:'When a car doesn’t sell, how high did bidding go?',
    p3t:'Bidding ran far above typical — and the car still didn’t sell',
    p4t:'Did a failed price “come true” in a later sale?',
    p5t:'Bidders who keep coming back to this seller',
    p6t:'Who does the bidding on their auctions',
    c1:'Great photos, presentation, and reputation genuinely earn higher prices. Strong prices alone are simply what a great seller looks like.',
    c2:'Setting an ambitious minimum price on a desirable car produces high failed bids honestly. This is a reason to read on, not a conclusion.',
    c3:'Popular cars with high minimum prices produce this exact pattern innocently — bidding runs hot, the minimum isn’t met, no sale.',
    c4:'A seller’s own cars are similar to each other, so similar prices can happen naturally. The market-wide number above shows how rare a very close match is.',
    c5:'Fans of a brand come back to a favorite dealer again and again. Most auction accounts never buy anything — that alone means little.',
    c6:'Busy, expensive auctions attract more of everything. Enthusiasts bid often and lose often, honestly.',
    counter:`<b>Keep this in mind.</b> Every pattern above has an innocent explanation, and in a
     market-wide test, auctions dominated by never-bought accounts actually sold for LESS, not
     more. These pages point human attention; they never conclude. The real question is always:
     did the price hold up later, and did the winner actually pay.`
  }:{
    eyebrow:`seller dossier · window ${d.first??'—'} → ${d.last??'—'}`,
    pipsLabel:`review priority ${d.priority}/5 — ${active.length?esc(active.join(' · ')):'no signals above the population 95th percentile'}`,
    p1t:'Realization premium (alpha)',p2t:'Failed-bid elevation',
    p3t:'High bids ≥50% above cohort that failed',p4t:'Comp-wash instances (±2%)',
    p5t:'Repeat-bidder concentration',p6t:'Most active ladder actors on these lots',
    c1:'Presentation, photography, and reputation earn genuine premiums. A high alpha alone is what a great consignor looks like — durability on re-trade is the tiebreaker.',
    c2:'Ambitious reserves on strong inventory produce elevated failed bids honestly. Elevation is a reading signal, not evidence of anything.',
    c3:'Hot models with high reserves produce the identical shape. Market-wide, elevated failures cluster on exactly the cars enthusiasts chase.',
    c4:'A seller\'s own comparables are similar cars — same spec taste raises price agreement honestly. The market base rate is shown for calibration.',
    c5:'Loyal brand-followers shop a favorite dealer\'s inventory repeatedly. Concentration p-values use market share, not taste-matched share, and overstate surprise for specialists. Zero-purchase is the platform base case (~86% of accounts).',
    c6:'Displacement counts are monotonic in lot activity; busy expensive lots generate more of everything. Marque specialists underbid honestly and often.',
    counter:`<b>Standing counter-case.</b> Every signal above has a benign twin, and in the
     full-market causal test, heavy thin-account lots realized <b>lower</b> prices, not higher
     (p=0.0004). Signals here order human attention; conclusions require the durability test —
     does the premium survive re-trade, and does the winner pay.`
  };
  document.getElementById('root').innerHTML=`
  <div class="eyebrow">${T.eyebrow}</div>
  <h1>${esc(d.name)}</h1>
  <div class="pips">${pips} ${T.pipsLabel}</div>
  <div class="stats">
    <div class="stat"><b>${d.lots}</b><span>lots</span></div>
    <div class="stat"><b>${d.sold}</b><span>sold</span></div>
    <div class="stat"><b>${d.rnm}</b><span>reserve not met</span></div>
    <div class="stat"><b>${d.sell_through}%</b><span>sell-through</span></div>
    <div class="stat"><b>${fmt$(d.gmv)}</b><span>gmv</span></div>
    <div class="stat"><b>${d.median_price?fmt$(d.median_price):'—'}</b><span>median sale</span></div>
  </div>
  <div class="chips">${d.cohorts.map(c=>`<i>${esc(c)}</i>`).join('')}</div>
  ${tl}`;
  const kk=S?['prices','prices','unsold auctions','price echoes','regular bidders','the bidding']
            :['price signal','price signal','phantom prices','anchoring','audience','ladder'];
  document.getElementById('root').insertAdjacentHTML('beforeend',`
  <div class="grid">
    <div class="panel"><div class="k">${kk[0]}</div><h2>${T.p1t}</h2>${alpha}
      <div class="confound"><b>the innocent explanation</b>${T.c1}</div></div>
    <div class="panel"><div class="k">${kk[1]}</div><h2>${T.p2t}</h2>${rnmEl}
      <div class="confound"><b>the innocent explanation</b>${T.c2}</div></div>
    <div class="panel"><div class="k">${kk[2]}</div><h2>${T.p3t}</h2>${phantoms}
      <div class="confound"><b>the innocent explanation</b>${T.c3}</div></div>
    <div class="panel"><div class="k">${kk[3]}</div><h2>${T.p4t}</h2>${cw}
      <div class="confound"><b>the innocent explanation</b>${T.c4}</div></div>
    <div class="panel"><div class="k">${kk[4]}</div><h2>${T.p5t}</h2>${repeat}
      <div class="confound"><b>the innocent explanation</b>${T.c5}</div></div>
    <div class="panel"><div class="k">${kk[5]}</div><h2>${T.p6t}</h2>${actors}
      <div class="confound"><b>the innocent explanation</b>${T.c6}</div></div>
  </div>
  <div class="counter">${T.counter}</div>`);
}
</script>
</body></html>
